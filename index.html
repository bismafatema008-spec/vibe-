      (function() {
        // Safeguard against third-party or iframe wrappers attempting to assign to getter-only window.fetch
        try {
          var _origFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _origFetch;
            },
            set: function(newFetch) {
              _origFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          try {
            var _protoFetch = Window.prototype.fetch;
            Object.defineProperty(Window.prototype, 'fetch', {
              get: function() {
                return _protoFetch;
              },
              set: function(newFetch) {
                _protoFetch = newFetch;
              },
              configurable: true,
              enumerable: true
            });
          } catch (e) {}
        }

        // Catch and suppress uncaught getter-only fetch property assignment errors from any extensions or parent frames
        window.addEventListener('error', function(event) {
          if (
            event &&
            event.message &&
            typeof event.message === 'string' &&
            event.message.indexOf('fetch') !== -1 &&
            event.message.indexOf('getter') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
